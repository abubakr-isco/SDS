[project]
name = "sds-telegram-bot"
version = "1.0.0"
description = "SDS Trucking Telegram bot"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations/versions", ".localdb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF"]
ignore = [
  "RUF001", "RUF002", "RUF003",  # intentional typographic quotes/dashes in customer copy
  "S101",                         # assert in tests
  "B008",
  "E501",                         # line length is handled by `ruff format`; long strings are customer copy
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "RUF012", "ASYNC109"]  # mocks must match aiogram signatures
"app/utils/validation.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["error::sqlalchemy.exc.SAWarning"]
